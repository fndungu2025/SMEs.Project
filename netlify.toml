# Netlify configuration — static site, no build step required.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://ownmlbmnpadfbedcwrph.supabase.co; connect-src 'self' https://ownmlbmnpadfbedcwrph.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    # Vendored files carry their version in the filename, so they never change.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/account.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/profile.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/reset-password.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/apply"
  to = "/#eligibility"
  status = 302

[[redirects]]
  from = "/calculator"
  to = "/#calculator"
  status = 302

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/login.html#signup"
  status = 302

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 301
